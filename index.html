  <!-- FECHA -->
  <section id="fecha" class="fade-up">
    <span class="save-label">Save the Date</span>
    <div class="date-display">03 &middot; 10</div>
    <span class="date-line"></span>
    <span class="year-tag">2026</span>
  </section>

  <!-- LEYENDA -->
  <section id="leyenda" class="fade-up">
    <p class="legend-text">
      Con gran alegría, queremos compartir con ustedes una fecha muy especial.<br />
      Reserva el día y acompáñanos a celebrar nuestra unión.
    </p>
  </section>

  <!-- UBICACIÓN -->
  <section id="ubicacion" class="fade-up">
    <div class="ubicacion-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" class="ubicacion-icon" viewBox="0 0 24 24">

      </svg>
      <p class="ubicacion-texto">García, Nuevo León</p>
    </div>
  </section>

  <footer></footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Fade-in on scroll -->
  <script>
    const obs = new IntersectionObserver(
      es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
      { threshold: 0.1 }
    );
    document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
  </script>

</html>
